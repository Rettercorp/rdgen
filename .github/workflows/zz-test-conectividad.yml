name: zz test conectividad (temporal)
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: probar puertos
        run: |
          curl -s -m5 https://api.ipify.org; echo " <- IP del runner"
          for t in 186.23.20.8:443 181.171.165.236:443 186.23.20.8:80 186.23.20.8:21116 186.23.20.8:993; do
            h=${t%:*}; p=${t#*:}
            if timeout 8 bash -c "</dev/tcp/$h/$p" 2>/dev/null; then echo "$t ABIERTO"; else echo "$t SIN RESPUESTA"; fi
          done
